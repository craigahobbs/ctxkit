[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxkit"
version = "2.2.4"
description = "ctxkit is a command-line tool for creating AI prompts to modify code"
readme = "README.md"
license = "MIT"
keywords = ["ai", "context", "prompt", "llm", "code"]
authors = [
    {name = "Craig A. Hobbs", email = "craigahobbs@gmail.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities"
]
dependencies = [
    "schema-markdown >= 1.3.0",
    "urllib3 >= 2.5.0"
]

[project.urls]
Homepage = "https://github.com/craigahobbs/ctxkit"

[project.scripts]
ctxkit = "ctxkit.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ctxkit", "ctxkit.api"]
